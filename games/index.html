<!DOCTYPE html>
<html>
<head>
      <script src="/common.js"></script>
    <link rel='stylesheet' href="/container.css">
<title>Play games</title>
<style>
body {
    background-image: url('/mainSprites/BG.png');
}

h1{
  font-family: pixelBold;
  font-size: 50px;
}

</style>

</head>


<body>
<div id="navbar-placeholder"></div> 
<img class = "centered" src="assets/GamesTitle.png" height = "300" alt = "Games" style="image-rendering: pixelated"></img>

<!--games-->
<div class=container id = "gamesHolder">

</div>


<script>

async function gamNames(){
  var aud = document.getElementById("musicAud");
  const holder=document.getElementById("gamesHolder");
  const jsonFile =await fetch('/games/games.json');
  if (!jsonFile.ok){
  throw new Error('didnt load games json');
  }
  const text = await jsonFile.text();
  const gam = JSON.parse(text);
  //goes through music.json and gets every key to place in the div
  for (const key in gam){
    let thumbName=gam[key]["thumbnail"];
    console.log(thumbName);
    var newGame = document.createElement("a");
    newGame.href="game";
    newGame.className="gameThumbnail";
    newGame.innerHTML=`<img src = "/mainSprites/thumbnails/${thumbName}" alt = "${key}"
    style ="image-rendering: pixelated;">
    <p style="line-height:30px;">${key}</p>`;
    newGame.onclick= () => goToGame(key,gam[key]["engine"]);
    holder.append(newGame);
      
  }
}
gamNames();

function goToGame(game,engine){
    sessionStorage.setItem('game',game);
    sessionStorage.setItem('engine',engine);

}
</script>
</body>

</html>
