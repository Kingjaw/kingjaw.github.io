<!-- nav.html -->
 <head>

  <meta content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/mainSprites/TabIcon.png">

<style>
body {
  margin: 0;
  padding-top: 88px;
  background: url("/mainSprites/BG.png");
}
img{
  image-rendering: pixelated;
  user-select: none;
  -webkit-user-select: none; 
  -moz-user-select: none;  
  -ms-user-select: none;  
}
h1, h2, h3{
  font-family: pixelBold;
}

.navbar {
  overflow: hidden;
  background-image: url('/mainSprites/navBarBG.png');
  background-size: auto 100%;
  image-rendering: pixelated;
  background-repeat: repeat-x;
  background-position: center;
  border-bottom: 4px solid black;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 100;
  display:flex;
  flex-wrap: nowrap;
  flex-shrink: 1;
}

.navbar a {
  float:left;
  color: #f2f2f2;
  text-align: center;
  padding: 8px 14px;
  text-decoration: none;
  font-size: 17px;
}
.navbar img{
  flex-shrink: 1; /* allow shrinking instead of wrapping/overflowing */
  min-width: 0;   /* important: overrides flex items' default min-width:auto, which otherwise blocks shrinking below content size */
  max-width: 100%;
  height:auto;
}

@font-face {
    font-family: pixelBold;
    src: url('/DePixelEdited.ttf');
}

</style>
 </head>

<nav class="navbar">
    <a href="/index.html">
      <img src="/mainSprites/Kingjaw.png" style ="width: 368px; image-rendering: pixelated;" alt='kingjaw'>
    </a>
    <a href="/games/">
      <img src="/mainSprites/GamesIcon.png" style =" width: 216px; image-rendering: pixelated;" alt='games'>
    </a>
    <a href="/music">
      <img src="/mainSprites/musicIcon.png" style =" width: 208px; image-rendering: pixelated;" alt='music'>
    </a>
    <a href="/more">
        <img src="/mainSprites/MoreIcon.png" style =" width: 188px; image-rendering: pixelated;" alt='fun'>
    </a>
</nav>
