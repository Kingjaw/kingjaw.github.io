<script>

async function loadGameURL(){
    url=window.location.href.split('/');
    console.log(window.location.href.split('/'));
    for (let i=0;i<url.length;i++){
    if (url[i]=="games"){
        j=i+1;
        const jsonFile =await fetch('/games/games.json');
        if (!jsonFile.ok){
            throw new Error('didnt load games json');
        }
        const text = await jsonFile.text();
        const gam = JSON.parse(text);
        for (key in gam){
        //check if the removed spaces version is equal to whats in the url
        if (removeSpaces(key)==url[j]){
            sessionStorage.setItem('game',key);
            newURL=replaceStrPart(window.location.href,url[j],"game")
            window.location.replace(newURL);
            break;
        }
        }
        break;
    }
    }
}
loadGameURL();

</script>

</html>
