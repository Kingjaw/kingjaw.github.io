<!DOCTYPE html>
<html>
<head>
<title>Fun!!</title>
<script src="/common.js"></script>

<style>
    h1,h2{
        height:20px;
        text-align: center;
        font-family: pixelBold;
        display:block;
    }
.center {
  display: block;
  margin-left: auto;
  margin-right: auto;
  margin-top:60px;
  height:350px
}

</style>
</head>

<body>
<div id = 'navbar-placeholder'></div>

<!--Take local storage from previous page and use it for character-->
<script>
async function loadChar(){
let power = localStorage.getItem('power');
let sociability = localStorage.getItem('sociability');
let empathy = localStorage.getItem('empathy');
let sanity = localStorage.getItem('sanity');
const characterjson =await fetch('/fun/assets/characters.json');
const text = await characterjson.text();
const chars = JSON.parse(text);
let maxCloseness=999;
let bestChar="";
Object.keys(chars).forEach(key=>{
let closeness=0;
closeness+=Math.abs(power-chars[key]["power"]);
closeness+=Math.abs(sociability-chars[key]["sociability"]);
closeness+=Math.abs(empathy-chars[key]["empathy"]);
closeness+=Math.abs(sanity-chars[key]["sanity"]);
console.log(key);
console.log(closeness);
if (closeness < maxCloseness){
    maxCloseness=closeness;
    bestChar=key;
}
});

let imgName=chars[bestChar]["image"];
console.log(bestChar)
document.getElementById("characterImg").src=`/fun/assets/characterScreenshots/${imgName}`;
document.getElementById("characterNam").innerHTML=bestChar;
document.getElementById("yourStats").innerHTML=`Power: ${power}, Sociability: ${sociability}, Empathy: ${empathy}, Sanity: ${sanity}`;
document.getElementById("characterSummary").innerHTML=chars[bestChar]["desc"]
}
loadChar();

</script>

<h1>Your character is...</h1>
<img id = "characterImg" class="center" style = "image-rendering: pixelated; border: solid black 4px;"></img>
<h1 id = "characterNam"></h1>
<br>
<h2 id = "characterSummary" margin-top=50px></h2>
<br><br><br><br><br>
<h2 id = "yourStats" style="padding-bottom: 20px;"></h2>

</body>

</body>
</html>
